<!--
  Five frameworks, one diagram - used by README.md, docs/index.md and
  docs/frameworks/index.md.

  Edit this file directly; it is the source. The snippets are trimmed from
  the runnable examples in docs/examples/*, and the key colours match the
  !define block PlantUMLGenerator emits (#b8861b primary, #8c8c8c foreign).
  After editing, re-export the PNG at 1600x840, e.g.
      uv run --group docs python -c "import cairosvg; cairosvg.svg2png(\
          url='docs/examples/frameworks.svg',\
          write_to='docs/examples/frameworks.png',\
          output_width=1600, output_height=840)"
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-label="The same User and Order schema written in SQLModel, SQLAlchemy, Django, Pydantic and dataclasses, all producing one ERD">
<rect width="1600" height="840" fill="#fbfaf8"/>
