name: 🐛 Bug Report
description: erdify draws something wrong, crashes, or a flag doesn't work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please check the
        [known limitations](https://erdify.devsuit.io/frameworks/limitations/)
        first — the behaviour may be documented there.

        **Never paste real customer or production models.** Reduce the problem
        to a minimal, anonymized snippet.
  - type: dropdown
    id: framework
    attributes:
      label: Model source
      multiple: true
      options:
        - SQLModel
        - SQLAlchemy 2.0 (ORM classes)
        - SQLAlchemy Core tables / imperative mapping
        - Django ORM
        - Pydantic
        - dataclass
        - SQL DDL (erdify[sql])
        - Not model-related (CLI, config, output format)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest model file that shows the problem. It should be valid for the framework (e.g. it imports and configures).
      render: python
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact erdify command, including flags.
      placeholder: erdify models/ --format mermaid -o -
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your `[tool.erdify]` table from `pyproject.toml`, if any.
      render: toml
  - type: textarea
    id: actual
    attributes:
      label: What erdify produced
      description: The relevant part of the output (diagram text, JSON) or the error with traceback.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the framework actually builds — e.g. the table's columns, keys or relationships as Django / SQLAlchemy / SQLModel creates them — or the documented behaviour.
    validations:
      required: true
  - type: input
    id: erdify-version
    attributes:
      label: erdify version
      description: Output of `erdify --version`.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python and framework versions
      placeholder: Python 3.13, SQLAlchemy 2.1.8, SQLModel 0.0.48
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on a fix?
      options:
        - "No"
        - "Yes, I'd like to open a PR"
