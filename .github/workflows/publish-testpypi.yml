name: Publish to TestPyPI

# Manual dry-run: validate the full build + publish path against TestPyPI
# before cutting a real release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (optional; TestPyPI rejects duplicates, so bump for re-runs, e.g. 0.2.0.dev1)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    # Separate gated environment; needs its own Trusted Publisher on test.pypi.org.
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Resolve uv to the newest version whose checksum is shipped with
          # setup-uv, rather than whatever `latest` is at job start. New uv
          # versions then only reach CI through a setup-uv release, i.e. a
          # reviewed, cooldown-gated Dependabot PR.
          version: "latest-known"
      - name: Override version (optional)
        if: inputs.version != ''
        run: uv version "${{ inputs.version }}"
      - name: Build distributions
        run: uv build
      - name: Publish to TestPyPI
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/
