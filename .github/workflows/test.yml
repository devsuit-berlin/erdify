name: Testing

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python sweep on Linux (primary platform).
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # macOS/Windows smoke-test min+max supported Python to catch
        # path/encoding/line-ending issues without a full NxM matrix.
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.15"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Resolve uv to the newest version whose checksum is shipped with
          # setup-uv, rather than whatever `latest` is at job start. New uv
          # versions then only reach CI through a setup-uv release, i.e. a
          # reviewed, cooldown-gated Dependabot PR.
          version: "latest-known"
          # Sets UV_PYTHON for every later step. Without it, uv honours the
          # repository's `.python-version` (the local dev default) over the
          # interpreter setup-python puts on PATH, and every leg silently tests
          # that one version instead of its own.
          python-version: ${{ matrix.python-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      # Fail loudly if the environment ever drifts off the matrix version
      # again — the job name would otherwise keep claiming coverage it lacks.
      - name: Assert the matrix Python is in use
        env:
          EXPECTED: ${{ matrix.python-version }}
        shell: bash
        run: uv run python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED'], sys.version"
      - name: Run Tests
        run: uv run pytest --cov=erdify tests/ --cov-report=xml --cov-report=term-missing
      # Coverage is uploaded from a single matrix leg. Every leg produces the
      # same line coverage, so nine uploads per commit would only fragment the
      # report in Datadog without adding signal.
      #
      # The workflow runs on `pull_request` (never `pull_request_target`), so a
      # PR from a fork has no access to repository secrets. The condition skips
      # the step there rather than letting it fail on an empty API key — and
      # switching this trigger to `pull_request_target` would expose the key to
      # untrusted code, so don't.
      #
      # Dependabot needs its own clause: its head branch lives in this
      # repository, so the fork condition above passes, but GitHub runs those
      # workflows with Dependabot secrets instead of Actions secrets. The key
      # would be empty and the upload would fail the required `Tests passed`
      # check on every dependency bump.
      #
      # Do NOT express that as `secrets.X != ''`: "Secrets cannot be directly
      # referenced in `if:` conditionals" (GitHub docs, Using secrets in GitHub
      # Actions). Doing so is a workflow validation error — the whole run ends
      # in startup_failure with no jobs at all, which is how this was found.
      # The documented workaround is a job-level env var, but that would put
      # the API key in the environment of every step in the job, including
      # `uv sync` and `pytest`, so match on the actor instead.
      - name: Upload coverage to Datadog
        if: >-
          !cancelled()
          && matrix.os == 'ubuntu-latest'
          && matrix.python-version == '3.13'
          && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77 # v1.0.5
        with:
          api_key: ${{ secrets.DATADOG_CODE_COVERAGE_KEY }}
          site: datadoghq.eu
          # The action itself is SHA-pinned, but its `version` input defaults to
          # the floating "v5", which would install whichever datadog-ci release
          # is newest at job start — a mutable binary that runs with the API key.
          # Pin it too. Bumping is manual: Dependabot does not track action
          # inputs, only the `uses` reference above.
          version: "v5.23.0"
          flags: "type:unit-tests,language:python"
          files: coverage.xml

  # The Django ground-truth tests (tests/test_ground_truth_django.py) load every
  # Django model source with the real framework and compare its schema with
  # erdify's parse. The lockfile pins the 5.2 LTS (the last series supporting
  # Python 3.11), which the `test` matrix above runs; this job repeats those
  # tests on each supported Django series. `uv run --with` resolves the newest
  # patch release of the series on top of the locked environment, so new
  # patches are picked up without a lockfile change.
  django:
    name: Django ${{ matrix.django }} ground truth
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django: ["5.2", "6.0", "6.1"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
          # Django 6.x requires Python >= 3.12.
          python-version: "3.13"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Assert the matrix Django is in use
        env:
          EXPECTED: ${{ matrix.django }}
        run: >-
          uv run --with "django~=${{ matrix.django }}.0" python -c
          "import django, os; v = '%d.%d' % django.VERSION[:2];
          assert v == os.environ['EXPECTED'], django.__version__; print(django.__version__)"
      - name: Run the Django ground-truth tests
        run: uv run --with "django~=${{ matrix.django }}.0" pytest tests/test_ground_truth_django.py -rsx

  # The SQLAlchemy / SQLModel ground-truth tests
  # (tests/test_ground_truth_sqlalchemy.py) execute every SQLAlchemy and
  # SQLModel model source, configure its mappers and compare the metadata with
  # erdify's parse; tests/test_fixtures_valid.py checks the fixtures import.
  # The `test` matrix runs the locked versions; this job repeats those tests on
  # each supported SQLAlchemy series (newest patch release, `uv run --with`,
  # like the Django job) and on the oldest supported SQLModel, 0.0.22 (which
  # requires SQLAlchemy < 2.1), each release where SQLModel's behaviour
  # changed, and the locked one. Keep the supported
  # versions in docs/installation.md in sync with this matrix.
  sqlalchemy:
    name: SQLAlchemy ${{ matrix.sqlalchemy }} / SQLModel ${{ matrix.sqlmodel }} ground truth
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sqlalchemy: "2.0", sqlmodel: "0.0.22" }
          # A release where SQLModel changed what it builds (#295: Field() in
          # Annotated metadata), so the documented boundary is pinned.
          - { sqlalchemy: "2.0", sqlmodel: "0.0.32" }
          - { sqlalchemy: "2.0", sqlmodel: "locked" }
          - { sqlalchemy: "2.1", sqlmodel: "locked" }
    env:
      SQLALCHEMY: ${{ matrix.sqlalchemy }}
      SQLMODEL: ${{ matrix.sqlmodel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
          python-version: "3.13"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Assert the matrix versions are in use
        run: |
          extra=(--with "sqlalchemy~=$SQLALCHEMY.0")
          [[ "$SQLMODEL" != locked ]] && extra+=(--with "sqlmodel==$SQLMODEL")
          # On a `locked` leg, SQLModel must be the lockfile's version.
          uv run "${extra[@]}" python -c "
          import os, sqlalchemy, sqlmodel, tomllib
          print('SQLAlchemy', sqlalchemy.__version__, '/ SQLModel', sqlmodel.__version__)
          assert sqlalchemy.__version__.startswith(os.environ['SQLALCHEMY'] + '.')
          expected = os.environ['SQLMODEL']
          if expected == 'locked':
              lock = tomllib.load(open('uv.lock', 'rb'))
              expected = next(p['version'] for p in lock['package'] if p['name'] == 'sqlmodel')
          assert sqlmodel.__version__ == expected, (sqlmodel.__version__, expected)
          "
      - name: Run the SQLAlchemy / SQLModel ground-truth tests
        run: |
          extra=(--with "sqlalchemy~=$SQLALCHEMY.0")
          [[ "$SQLMODEL" != locked ]] && extra+=(--with "sqlmodel==$SQLMODEL")
          uv run "${extra[@]}" pytest tests/test_ground_truth_sqlalchemy.py tests/test_fixtures_valid.py -rsx

  # README coverage badge. Datadog exposes no public badge endpoint, so the
  # percentage is published as a shields.io endpoint payload at
  # https://raw.githubusercontent.com/devsuit-berlin/erdify/badges/coverage.json
  #
  # The payload lives on the orphan `badges` branch of this repository rather
  # than in a Gist or a third-party badge service: the repository then owns the
  # badge data, so nothing breaks when a contributor's account or token goes
  # away, and the built-in GITHUB_TOKEN is the only credential involved.
  #
  # A separate job because it needs `contents: write`, which the test matrix
  # must not have. It recomputes coverage instead of taking an artifact from the
  # matrix — a 20-second test run is cheaper than pinning two more actions in a
  # repository whose Actions allowlist is deliberately narrow.
  badge:
    name: Coverage badge
    # Pushes to `main` only: a pull request must not move what the default
    # branch advertises, and fork pull requests have no write token anyway.
    if: github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout the badges branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: badges
          path: .badges
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Measure coverage
        run: uv run pytest --cov=erdify tests/ --cov-report=xml
      - name: Write the badge payload
        run: |
          python - <<'PY' > .badges/coverage.json
          import json
          import xml.etree.ElementTree as ET

          percentage = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          # Below fail_under (90) the test job fails anyway, so the scale is
          # centred on the range that still carries information.
          thresholds = ((95, "brightgreen"), (90, "green"), (85, "yellowgreen"), (70, "yellow"))
          color = next((c for t, c in thresholds if percentage >= t), "red")
          badge = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{percentage:.2f}%",
              "color": color,
          }
          print(json.dumps(badge, indent=2))
          PY
          cat .badges/coverage.json
      - name: Commit the badge payload
        working-directory: .badges
        run: |
          if git diff --quiet -- coverage.json; then
            echo "Coverage unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -m "chore(badge): coverage $(python -c "import json;print(json.load(open('coverage.json'))['message'])")"
          git push

  # Single aggregate check to require in branch protection / rulesets. It turns
  # green only when every matrix leg above passes, so new Python versions or OSes
  # can be added to the matrix without editing the required-checks list.
  gate:
    name: Tests passed
    if: always()
    needs: [test, django, sqlalchemy]
    runs-on: ubuntu-latest
    steps:
      # `badges` holds only bot-written badge payloads. A pull request from it
      # would look perfectly mergeable — the tests pass, since the branch adds
      # no code — while replacing `main`'s README with the branch's own. GitHub
      # offers no setting to bar a branch from being a pull-request *source*
      # (branch protection and rulesets only guard a branch as a merge target),
      # so failing the required check is the way to make such a pull request
      # unmergeable. This runs unconditionally and passes for every other head
      # branch, which keeps it safe to require in the ruleset.
      - name: Refuse pull requests from machine-written branches
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == "badges" ]]; then
            echo "::error::The badges branch is machine-written and must never be merged into main. Close this pull request."
            exit 1
          fi
      - name: Fail if any matrix job failed
        if: >-
          needs.test.result != 'success' || needs.django.result != 'success'
          || needs.sqlalchemy.result != 'success'
        run: exit 1
