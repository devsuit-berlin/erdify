name: Testing

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python sweep on Linux (primary platform).
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # macOS/Windows smoke-test min+max supported Python to catch
        # path/encoding/line-ending issues without a full NxM matrix.
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
    # 3.15 is still a pre-release; let it run for early signal without blocking CI.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Resolve uv to the newest version whose checksum is shipped with
          # setup-uv, rather than whatever `latest` is at job start. New uv
          # versions then only reach CI through a setup-uv release, i.e. a
          # reviewed, cooldown-gated Dependabot PR.
          version: "latest-known"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run Tests
        run: uv run pytest --cov=erdify tests/ --cov-report=xml --cov-report=term-missing
      # Coverage is uploaded from a single matrix leg. Every leg produces the
      # same line coverage, so nine uploads per commit would only fragment the
      # report in Datadog without adding signal.
      #
      # The workflow runs on `pull_request` (never `pull_request_target`), so a
      # PR from a fork has no access to repository secrets. The condition skips
      # the step there rather than letting it fail on an empty API key — and
      # switching this trigger to `pull_request_target` would expose the key to
      # untrusted code, so don't.
      - name: Upload coverage to Datadog
        if: >-
          !cancelled()
          && matrix.os == 'ubuntu-latest'
          && matrix.python-version == '3.13'
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77 # v1.0.5
        with:
          api_key: ${{ secrets.DATADOG_CODE_COVERAGE_KEY }}
          site: datadoghq.eu
          flags: "type:unit-tests,language:python"
          files: coverage.xml

      # README coverage badge. Datadog exposes no public badge endpoint, so the
      # percentage is published as a shields.io endpoint payload in a Gist.
      #
      # Only pushes to `main` update it: a PR run must not move the badge on the
      # default branch, and fork PRs have no secrets anyway. Same single leg as
      # the Datadog upload above.
      - name: Read coverage percentage
        id: coverage
        if: >-
          github.event_name == 'push'
          && matrix.os == 'ubuntu-latest'
          && matrix.python-version == '3.13'
        env:
          # The `secrets` context is not available in a step-level `if`, so the
          # token's presence is checked here instead. Without it the output stays
          # empty, which skips the badge update rather than failing the job.
          HAS_GIST_TOKEN: ${{ secrets.GIST_SECRET != '' }}
        run: |
          if [[ "$HAS_GIST_TOKEN" != "true" ]]; then
            echo "::warning::GIST_SECRET is not set; skipping the coverage badge update."
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET

          line_rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print(f"percentage={line_rate * 100:.2f}")
          PY
      - name: Update coverage badge
        # Empty when the step above was skipped, which skips this one too.
        if: steps.coverage.outputs.percentage != ''
        uses: Schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 927c3cce6a279569d07035f212836059
          filename: erdify-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          # Below fail_under (90) the badge should already look wrong, so the
          # gradient is centred on the range that matters rather than on 0-100.
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 85
          maxColorRange: 95

  # Single aggregate check to require in branch protection / rulesets. It turns
  # green only when every matrix leg above passes, so new Python versions or OSes
  # can be added to the matrix without editing the required-checks list. The
  # 3.15 pre-release leg is continue-on-error, so its failures do not block here.
  gate:
    name: Tests passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any matrix job failed
        if: needs.test.result != 'success'
        run: exit 1
